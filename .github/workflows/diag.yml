name: diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 965460a9ac1715636c769634fd0d69f58b2bd0f9
          path: device

      - name: fetch the official fastboot archive
        working-directory: device
        run: |
          set -euo pipefail
          python3 scripts/download-sheng-firmware.py --connections 32
          ls -la .cache/firmware/sheng/

      - name: unpack super.img
        run: |
          set -euo pipefail
          ARCHIVE=$(ls device/.cache/firmware/sheng/*.tgz | head -1)
          SUPER=$(tar -tzf "$ARCHIVE" | grep -E '/super\.img$' | head -1)
          echo "super member: $SUPER"
          mkdir -p /tmp/rom
          tar -xzf "$ARCHIVE" -C /tmp/rom "$SUPER"
          ls -la "/tmp/rom/$SUPER"
          python3 tool/tools/super_unpack.py "/tmp/rom/$SUPER" --list

      - name: extract vendor and locate the firmware
        run: |
          set -euo pipefail
          ARCHIVE=$(ls device/.cache/firmware/sheng/*.tgz | head -1)
          SUPER=$(tar -tzf "$ARCHIVE" | grep -E '/super\.img$' | head -1)
          python3 tool/tools/super_unpack.py "/tmp/rom/$SUPER" --extract vendor --out /tmp/vendor.img
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils
          rm -rf /tmp/vendorout
          fsck.erofs --extract=/tmp/vendorout /tmp/vendor.img || true
          echo '--- candidates ---'
          find /tmp/vendorout -type f \( -iname 'amss.bin' -o -iname 'm3.bin' -o -iname 'board-2.bin' \) -print0 2>/dev/null | xargs -0 -r sha256sum || true
          echo '--- ath12k dirs ---'
          find /tmp/vendorout -type d -iname '*ath12k*' 2>/dev/null | head -20
          echo '--- bt firmware ---'
          find /tmp/vendorout -type d -iname '*bt*' 2>/dev/null | head -10