name: diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 965460a9ac1715636c769634fd0d69f58b2bd0f9
          path: device

      - name: fetch the official fastboot archive
        working-directory: device
        run: |
          set -euo pipefail
          python3 scripts/download-sheng-firmware.py --connections 32

      - name: list every archive member
        run: |
          set -euo pipefail
          ARCHIVE=$(ls device/.cache/firmware/sheng/*.tgz | head -1)
          tar -tzf "$ARCHIVE" | sed -n '1,120p'

      - name: unpack vendor and inspect the firmware layout
        run: |
          set -euo pipefail
          ARCHIVE=$(ls device/.cache/firmware/sheng/*.tgz | head -1)
          SUPER=$(tar -tzf "$ARCHIVE" | grep -E '/super\.img$' | head -1)
          mkdir -p /tmp/rom
          tar -xzf "$ARCHIVE" -C /tmp/rom "$SUPER"
          python3 tool/tools/super_unpack.py "/tmp/rom/$SUPER" --extract vendor --out /tmp/vendor.img
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils
          rm -rf /tmp/vendorout
          fsck.erofs --extract=/tmp/vendorout /tmp/vendor.img || true
          echo '--- top level ---'
          ls /tmp/vendorout | head -30
          echo '--- vendor/firmware ---'
          ls -la /tmp/vendorout/vendor/firmware 2>/dev/null | head -40
          echo '--- any wcn/amss/ath12k ---'
          find /tmp/vendorout \( -iname '*wcn*' -o -iname 'amss*' -o -iname '*ath12k*' -o -iname 'board-2.bin' \) 2>/dev/null | head -40
          echo '--- bt_firmware ---'
          ls -la /tmp/vendorout/vendor/bt_firmware 2>/dev/null | head -20
          echo '--- size of firmware dirs ---'
          du -sh /tmp/vendorout/vendor/firmware /tmp/vendorout/vendor/bt_firmware 2>/dev/null || true