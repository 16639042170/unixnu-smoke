name: diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 965460a9ac1715636c769634fd0d69f58b2bd0f9
          path: device

      - name: fetch archive and unpack vendor
        run: |
          set -euo pipefail
          cd device
          python3 scripts/download-sheng-firmware.py --connections 32
          cd ..
          ARCHIVE=$(ls device/.cache/firmware/sheng/*.tgz | head -1)
          SUPER=$(tar -tzf "$ARCHIVE" | grep -E '/super\.img$' | head -1)
          mkdir -p /tmp/rom
          tar -xzf "$ARCHIVE" -C /tmp/rom "$SUPER"
          python3 tool/tools/super_unpack.py "/tmp/rom/$SUPER" --extract vendor --out /tmp/vendor.img
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils

      - name: list the vendor firmware trees
        run: |
          set +e
          rm -rf /tmp/vendorout
          fsck.erofs --extract=/tmp/vendorout /tmp/vendor.img 2>&1 | tail -3
          echo '--- vendor root ---'
          ls /tmp/vendorout | head -40
          echo '--- firmware ---'
          ls -la /tmp/vendorout/firmware | head -60
          echo '--- firmware_mnt ---'
          ls -la /tmp/vendorout/firmware_mnt 2>&1 | head -20
          echo '--- bt_firmware ---'
          ls -la /tmp/vendorout/bt_firmware 2>&1 | head -30
          echo '--- any amss/board-2/m3 anywhere ---'
          find /tmp/vendorout -iname 'amss*' -o -iname 'board-2.bin' -o -iname 'm3.bin' 2>/dev/null | head -20
          echo '--- wlan-ish dirs ---'
          find /tmp/vendorout -maxdepth 4 -type d \( -iname '*wlan*' -o -iname '*wifi*' -o -iname '*qca*' -o -iname '*ath*' \) 2>/dev/null | head -20
          echo '--- sizes ---'
          du -sh /tmp/vendorout/firmware /tmp/vendorout/bt_firmware 2>&1